name: Windows installer
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified installer as a GitHub release (requires main branch)
        type: boolean
        default: false
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'packaging/windows/**'
      - '.github/workflows/windows-release.yml'
  push:
    branches: [main]
    paths:
      - 'version.py'
      - '.github/workflows/windows-release.yml'
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q explorer.py modules platform_adapters version.py
      - name: GUI smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python explorer.py --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        timeout-minutes: 2
      - run: python tools/build_icon.py
      - run: python -m PyInstaller --clean --noconfirm --windowed --onedir --name Folder --icon assets/folder.ico --collect-all imageio_ffmpeg explorer.py
      - name: Bundle LibVLC runtime
        shell: pwsh
        run: ./packaging/windows/fetch_vlc.ps1 -Destination dist/Folder/vlc
      - name: Bundle Everything portable indexing engine
        shell: pwsh
        run: ./packaging/windows/fetch_everything.ps1 -Destination dist/Folder/everything
      - name: Capture actual application screenshots
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          New-Item -ItemType Directory -Force vendor | Out-Null
          Copy-Item dist/Folder/vlc vendor/vlc -Recurse -Force
          python tools/capture_screenshots.py
          if (!(Test-Path screenshots/workspace.png) -or !(Test-Path screenshots/addons.png) -or !(Test-Path screenshots/options.png)) { throw 'Screenshot capture failed' }
        timeout-minutes: 2
      - run: python packaging/windows/collect_notices.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" packaging/windows/Folder.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $file = Get-Item "installer/Folder-$version-Setup-x64.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii "$($file.FullName).sha256"
      - name: Test installation and executable
        shell: pwsh
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          $target = Join-Path $env:RUNNER_TEMP "FolderInstallTest"
          $p = Start-Process "installer/Folder-$version-Setup-x64.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=`"$target`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed" }
          if (!(Test-Path "$target\Folder.exe")) { throw "Executable missing" }
          $env:QT_QPA_PLATFORM='offscreen'
          $p = Start-Process "$target\Folder.exe" -ArgumentList '--smoke-test' -PassThru
          if (!$p.WaitForExit(30000)) { $p.Kill(); throw "Application smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "Application smoke test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: Folder-Windows-x64-installer
          path: |
            installer/*
            screenshots/*.png
          if-no-files-found: error
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: Folder-Windows-x64-installer
          path: installer
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          $tag = "v$version"
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF -ne "refs/tags/$tag") { throw "Tag and source version disagree" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release already exists; no overwrite"; exit 0 }
          gh release create $tag "installer/installer/Folder-$version-Setup-x64.exe" "installer/installer/Folder-$version-Setup-x64.exe.sha256" "installer/screenshots/workspace.png" "installer/screenshots/addons.png" "installer/screenshots/options.png" --target $env:GITHUB_SHA --title "Folder $version (Alpha)" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
