name: Ubuntu 24.04 x64 DEB
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'packaging/linux/**'
      - '.github/workflows/ubuntu-build.yml'
  push:
    branches: [feature/ubuntu-2404, main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'packaging/linux/**'
      - '.github/workflows/ubuntu-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: System libraries for Qt and media
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libvlc5 vlc-plugin-base
      - name: Install application dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q explorer.py addons.py modules platform_adapters
      - name: Unit and desktop smoke tests
        run: |
          python -m unittest discover -s tests -v
          python tools/test_plugins.py
          python tools/test_toolbar.py
          python explorer.py --smoke-test
      - name: Build native executable bundle
        run: |
          python tools/build_icon.py
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Folder --icon assets/folder.ico --collect-all imageio_ffmpeg explorer.py
          test -x dist/Folder/Folder
      - name: Test bundled Folder
        run: dist/Folder/Folder --smoke-test
      - name: Build Ubuntu DEB package
        run: bash packaging/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Folder-Ubuntu-24.04-amd64
          path: |
            installer/linux/*.deb
            installer/linux/*.sha256
          if-no-files-found: error
